{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <!-- Heading -->
                    <div class="text-center mb-4">

                        <div class="mb-3">
                            <span class="display-4">🔐</span>
                        </div>

                        <h1 class="fw-bold">
                            Welcome Back!
                        </h1>

                        <p class="text-muted">
                            Login to continue to your account
                        </p>

                    </div>


                    <hr class="mb-4">


                    <!-- Login Form -->
                    <form method="POST" action="{% url 'login' %}">

                        {% csrf_token %}


                        <!-- Username -->
                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label fw-semibold"
                            >
                                Username
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    👤
                                </span>

                                <input
                                    type="text"
                                    name="username"
                                    id="username"
                                    class="form-control"
                                    placeholder="Enter your username"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Password -->
                        <div class="mb-4">

                            <label
                                for="password"
                                class="form-label fw-semibold"
                            >
                                Password
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    🔑
                                </span>

                                <input
                                    type="password"
                                    name="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Login Button -->
                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg"
                            >
                                Login
                            </button>

                        </div>

                    </form>


                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
